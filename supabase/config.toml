project_id = "codegamer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = true

[functions.api]
verify_jwt = true

[functions.coordinator]
verify_jwt = false

# API verifies Bearer credentials with Auth /user; coordinator verifies a separate secret.
# PostgreSQL 18 is the student's SQL runtime, independent from Supabase's DB version.

[functions.session]
verify_jwt = false

[functions.feedback-mail]
verify_jwt = false
# Internal cron uses the existing coordinator secret, never a browser endpoint.
