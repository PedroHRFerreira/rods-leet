<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Confirme seu e-mail</title>
  </head>
  <body>
    <h1>Confirme seu e-mail no Rods Leet</h1>
    <p>
      Confirme o e-mail e depois defina sua senha. Seu progresso será
      preservado.
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/conta/confirmar?token_hash={{ .TokenHash }}&amp;type=email_change"
        >Continuar no Rods Leet</a
      >
    </p>
    <p>Se você não solicitou este e-mail, pode ignorá-lo.</p>
  </body>
</html>
