project_id = "codegamer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5178"
additional_redirect_urls = ["http://localhost:5178/conta/confirmar"]
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirme sua conta no Rods Leet"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirme seu e-mail no Rods Leet"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.recovery]
subject = "Recupere sua conta no Rods Leet"
content_path = "./supabase/templates/recovery.html"

[functions.api]
verify_jwt = true

[functions.coordinator]
verify_jwt = false

# API verifies Bearer credentials with Auth /user; coordinator verifies a separate secret.
# PostgreSQL 18 is the student's SQL runtime, independent from Supabase's DB version.

[functions.session]
verify_jwt = false

[functions.feedback-mail]
verify_jwt = false
# Internal cron uses the existing coordinator secret, never a browser endpoint.
