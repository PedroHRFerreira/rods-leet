name: Encrypted beta backup
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
permissions:
  contents: read
concurrency:
  group: codegamer-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    environment: beta-backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Export and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: bash scripts/backup.sh
