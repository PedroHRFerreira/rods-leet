name: Verify CodeGamer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --config supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/coordinator/index.ts
      - run: deno test --allow-env --config supabase/functions/deno.json supabase/functions/_shared/tests.ts
      - run: deno run --allow-run=docker --config supabase/functions/deno.json scripts/test-sql-references.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r executor/requirements.txt
      - run: python3 -m unittest discover -s executor -p 'test_*.py'
      - run: python3 scripts/test-database.py
